<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Layout torture</title>
<style>
  body { margin: 0; font: 14px Inter, sans-serif; background: #f8fafc; }
  .wrap { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .box { background: #fff; border-radius: 12px; padding: 16px; position: relative; min-height: 120px; }
  .z { position: relative; height: 100px; }
  .z div { position: absolute; width: 80px; height: 80px; border-radius: 8px; }
  .a { background: #f87171; left: 0; top: 0; z-index: 3; }
  .b { background: #60a5fa; left: 40px; top: 10px; z-index: 1; }
  .c { background: #34d399; left: 80px; top: 20px; z-index: 2; }
  .neg { position: absolute; inset: 8px; background: #fde68a; z-index: -1; border-radius: 10px; }
  .scroll { height: 90px; overflow: auto; border: 1px solid #e2e8f0; padding: 8px; }
  .borders { border-top: 4px solid #ef4444; border-right: 2px solid #3b82f6; border-bottom: 6px solid #22c55e; border-left: 3px dashed #a855f7; height: 60px; }
  .dashed { border: 2px dashed #64748b; border-radius: 10px; height: 60px; }
  .radii { border-radius: 30px 4px 30px 4px; background: #c4b5fd; height: 60px; }
  .inset { box-shadow: inset 0 2px 8px rgba(0,0,0,.25), 0 8px 24px rgba(15,23,42,.15); height: 60px; border-radius: 10px; background: #fff; }
  .opacity { opacity: .5; background: #0ea5e9; height: 40px; color: #fff; padding: 10px; }
  .circle { width: 60px; height: 60px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #6366f1); }
  .conic { width: 60px; height: 60px; border-radius: 50%; background: conic-gradient(#f43f5e, #f59e0b, #10b981, #3b82f6, #f43f5e); }
  .row { display: flex; gap: 12px; align-items: center; }
  .chip { padding: 6px 10px; border-radius: 6px; background: #e2e8f0; }
  .space { display: flex; justify-content: space-between; align-items: flex-end; }
  .fixed { position: fixed; right: 16px; bottom: 16px; background: #111827; color: #fff; padding: 10px 14px; border-radius: 10px; }
  .multi-bg { height: 70px; border-radius: 8px; background: linear-gradient(rgba(255,255,255,.0), rgba(255,255,255,.9)), repeating-linear-gradient(45deg, #fca5a5 0 10px, #fecaca 10px 20px); }
  .outline { outline: 3px solid #f59e0b; height: 40px; background: #fff7ed; }
  .hidden { visibility: hidden; } .hidden span { visibility: visible; color: #b91c1c; }
  .contents { display: contents; }
  .blend { mix-blend-mode: multiply; background: #22d3ee; width: 60px; height: 60px; margin-left: -20px; border-radius: 50%; }
  details summary { cursor: pointer; }
  .clip { width: 120px; height: 60px; overflow: hidden; border-radius: 30px; position: relative; background: #fee2e2; }
  .clip div { position: absolute; width: 200px; height: 30px; background: #ef4444; top: 15px; left: -20px; }
</style></head>
<body>
<div class="wrap">
  <div class="box"><div class="neg"></div><div class="z"><div class="a"></div><div class="b"></div><div class="c"></div></div></div>
  <div class="box"><div class="scroll">Scrollable content<br>line 2<br>line 3<br>line 4<br>line 5<br>line 6<br>line 7</div></div>
  <div class="box"><div class="borders"></div></div>
  <div class="box"><div class="dashed"></div><br><div class="radii"></div></div>
  <div class="box"><div class="inset"></div><div class="opacity">Half transparent</div></div>
  <div class="box"><div class="row"><div class="circle"></div><div class="conic"></div><div class="blend"></div><span class="chip">Chip</span><span class="chip">Another</span></div></div>
  <div class="box space"><span class="chip">left</span><span class="chip" style="padding:20px">mid</span><span class="chip">right</span></div>
  <div class="box"><div class="multi-bg"></div></div>
  <div class="box"><div class="outline">Outline</div><div class="hidden">hidden <span>visible child</span></div><div class="contents"><span class="chip">in display:contents</span></div></div>
  <div class="box"><details><summary>Closed details</summary>Secret</details><details open><summary>Open details</summary>Shown content</details><div class="clip"><div></div></div></div>
</div>
<div class="fixed">Fixed button</div>
</body></html>
