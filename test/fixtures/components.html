<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Components</title>
<style>
  body { margin: 32px; font: 15px/1.5 Inter, sans-serif; }
  @keyframes fade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .fade { animation: fade .8s ease-out 1s both; background: #ecfeff; padding: 16px; border-radius: 12px; margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { width: 24px; height: 24px; border-radius: 50%; border: 3px solid #a5b4fc; animation: spin 1s linear infinite; }
</style></head>
<body>
<div class="fade">This block fades in after a delay — it must be captured fully visible.</div>
<user-card name="Olena">Designer from <b>Kyiv</b></user-card>
<user-card name="Taras">Engineer</user-card>
<div id="rendered"></div>
<script>
customElements.define('user-card', class extends HTMLElement {
  constructor() {
    super();
    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = `
      <style>
        :host { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid #e5e7eb; border-radius: 12px; margin-bottom: 12px; width: 360px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#f472b6,#818cf8); color: #fff; font-weight: 700; display: grid; place-items: center; }
        .name { font-weight: 600; }
        ::slotted(*) { color: #6b7280; }
        .sub { color: #6b7280; font-size: 13px; }
      </style>
      <div class="avatar">${this.getAttribute('name')[0]}</div>
      <div><div class="name">${this.getAttribute('name')}</div><div class="sub"><slot></slot></div></div>`;
  }
});
document.getElementById('rendered').innerHTML = '<p style="color:#16a34a;font-weight:600">Rendered by JavaScript</p><div class="spinner"></div>';
</script>
</body></html>
